# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
#
# Weekly automated dependency checks. Every npm update — patch, minor, or
# major — is auto-merged by .github/workflows/auto-merge.yml as long as
# .github/workflows/ci.yml passes. If a bump breaks the build/tests, it is
# never merged and ci.yml pings the maintainer instead (maintainer decision
# 2026-09-07). The test suite is what's carrying the risk here: this policy
# is only as safe as that coverage actually is. A merged npm update then cuts
# an automatic patch release (auto-merge.yml dispatches release-pr.yml);
# github-actions updates don't.
#
# This file only drives the weekly version updates. Fix PRs for Dependabot
# security alerts (e.g. a vulnerable transitive dependency) come from the
# separate "Dependabot security updates" repo setting (Settings -> Code
# security), which ignores this schedule.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # Grouped so a bump to one lands as one PR instead of several, but
      # grouping only applies within the same semver-bump category (patch
      # updates to both won't be merged with an unrelated major update).
      map-libraries:
        patterns:
          - "mapbox-gl"
          - "maplibre-gl"
          - "@types/mapbox-gl"
      solid:
        patterns:
          - "solid-js"
          - "@solidjs/*"
          - "vite-plugin-solid"
    ignore:
      # TypeScript 7 is the native (Go) compiler with no JS API; tsup's dts
      # step (rollup-plugin-dts) and typedoc both need that API. Drop this
      # once they support TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
