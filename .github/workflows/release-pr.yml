name: Open release PR after a src change lands on main

# Runs when a PR merges into main and its diff touched src/ or package.json —
# the only changes a consumer of the published package actually gets.
# doc-only, test-only, or workflow-only PRs are filtered out by the `paths`
# trigger below, so there's no need for a separate diff-checking step.
#
# This listens on `pull_request: closed` rather than `push: branches: [main]`
# on purpose: PRs merged via `gh pr merge --auto` (both this workflow's own
# release PR and dependabot's auto-merge.yml) authenticate as the repo's
# GITHUB_TOKEN, and GitHub does not fire push-triggered workflow runs for
# pushes made with that token (its built-in recursive-workflow-run guard).
# That silently ate every dependabot merge and every release merge under the
# old `push` trigger — see the incident this was fixed after. `pull_request`
# events aren't subject to that guard, so this fires reliably regardless of
# which token performed the merge.
#
# This can't just `npm version patch` and push straight to main: main
# requires the "build-and-test" status check, and that check can only ever
# have run against a commit that already exists on some ref — a brand new
# commit created here has no status yet, so a direct push would be rejected.
# Routing the version bump through its own PR lets it pick up a real
# "build-and-test" run and merge through the exact same gate as every other
# change. publish.yml picks up from there and does the actual `npm publish`
# once that PR's merge commit lands.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "src/**"
      - "package.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    # Only actual merges (not merely closed-without-merging) count. Also
    # guards against this job's own release PR re-triggering itself: that
    # PR's title always starts with "chore(release): v" and it always
    # touches package.json, which would otherwise match the `paths` filter
    # above and loop forever.
    if: >-
      ${{ github.event.pull_request.merged == true &&
          !startsWith(github.event.pull_request.title, 'chore(release): v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own merge ref (refs/pull/N/merge) is torn down once the
          # PR closes, so check out the actual commit that landed on main.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TRIGGER_PR: ${{ github.event.pull_request.html_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git commit -am "chore(release): v$VERSION"
          git push origin "release/v$VERSION"
          gh pr create \
            --title "chore(release): v$VERSION" \
            --body "Automated patch release: $TRIGGER_PR merged into \`main\`, changing \`src/\` or \`package.json\`." \
            --base main \
            --head "release/v$VERSION"
          # No review requested/approved here: branch protection on main
          # doesn't require one (only the "build-and-test" status check), and
          # this token can't approve its own PR anyway.
          gh pr merge --auto --squash "release/v$VERSION"
