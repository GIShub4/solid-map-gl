name: Open release PR after a src change lands on main

# Runs when a PR merges into main and its diff touched src/ or package.json —
# the only changes a consumer of the published package actually gets.
# doc-only, test-only, or workflow-only PRs are filtered out by the `paths`
# trigger below, so there's no need for a separate diff-checking step.
#
# Triggered by `pull_request: closed`, which fires for a PR merged by a human.
# Note it does NOT fire for one merged by GITHUB_TOKEN (e.g. dependabot's
# auto-merge.yml): GitHub starts no workflow runs for any event caused by that
# token, except workflow_dispatch/repository_dispatch.
#
# This can't just `npm version patch` and push straight to main: main
# requires the "build-and-test" status check, and that check can only ever
# have run against a commit that already exists on some ref — a brand new
# commit created here has no status yet, so a direct push would be rejected.
# Routing the version bump through its own PR lets it pick up a real
# "build-and-test" run and merge through the exact same gate as every other
# change. This job then waits for that check itself, merges the release PR,
# and dispatches publish.yml explicitly — it can't leave the merge to
# `gh pr merge --auto` and expect publish.yml to notice, since that merge
# happens as GITHUB_TOKEN and its `closed` event starts no workflows (this is
# exactly how v2.2.5-v2.2.7 silently never got published).
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "src/**"
      - "package.json"

permissions:
  contents: write
  pull-requests: write
  actions: write # to dispatch publish.yml

jobs:
  release-pr:
    runs-on: ubuntu-latest
    # Only actual merges (not merely closed-without-merging) count. Also
    # guards against this job's own release PR re-triggering itself: that
    # PR's title always starts with "chore(release): v" and it always
    # touches package.json, which would otherwise match the `paths` filter
    # above and loop forever.
    if: >-
      ${{ github.event.pull_request.merged == true &&
          !startsWith(github.event.pull_request.title, 'chore(release): v') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's own merge ref (refs/pull/N/merge) is torn down once the
          # PR closes, so check out the actual commit that landed on main.
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TRIGGER_PR: ${{ github.event.pull_request.html_url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git commit -am "chore(release): v$VERSION"
          git push origin "release/v$VERSION"
          # No review requested/approved: branch protection on main doesn't
          # require one (only the "build-and-test" status check), and this
          # token can't approve its own PR anyway.
          gh pr create \
            --title "chore(release): v$VERSION" \
            --body "Automated patch release: $TRIGGER_PR merged into \`main\`, changing \`src/\` or \`package.json\`." \
            --base main \
            --head "release/v$VERSION"

      - name: Wait for CI, merge, and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="release/v$VERSION"
          # `gh pr checks --watch` exits immediately with "no checks reported"
          # until CI has registered its check run, so wait for it to appear.
          for i in $(seq 1 30); do
            # gh exits non-zero while checks are pending; only its output matters here.
            n=$(gh pr checks "$branch" --required --json name -q 'length' 2>/dev/null)
            [ "${n:-0}" -gt 0 ] && break
            sleep 10
          done
          gh pr checks "$branch" --required --watch --fail-fast
          gh pr merge "$branch" --squash --delete-branch
          gh workflow run publish.yml --ref main
