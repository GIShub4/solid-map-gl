name: Open release PR after a src change lands on main

# Runs on every push to main. Only cuts a release when the push actually
# changed something a consumer of the published package gets (src/ or
# package.json) — doc-only, test-only, or workflow-only commits are skipped.
#
# This can't just `npm version patch` and push straight to main: main
# requires the "build-and-test" status check, and that check can only ever
# have run against a commit that already exists on some ref — a brand new
# commit created here has no status yet, so a direct push would be rejected.
# Routing the version bump through its own PR lets it pick up a real
# "build-and-test" run and merge through the exact same gate as every other
# change. publish.yml picks up from there and does the actual `npm publish`
# once that PR's merge commit lands.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    # Guards against this job's own release-PR merge commit re-triggering
    # itself: that commit always touches package.json (the version bump),
    # which would otherwise match the path check below and loop forever.
    if: "${{ !startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check whether a releasable file changed
        id: check
        run: |
          changed_files=$(git diff --name-only HEAD^ HEAD)
          echo "$changed_files"
          if echo "$changed_files" | grep -qE '^(src/|package\.json$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs/tests/workflow-only push — skipping release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.changed == 'true'
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        if: steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v$VERSION"
          git commit -am "chore(release): v$VERSION"
          git push origin "release/v$VERSION"
          gh pr create \
            --title "chore(release): v$VERSION" \
            --body "Automated patch release: a push to \`main\` ($TRIGGER_SHA) changed \`src/\` or \`package.json\`." \
            --base main \
            --head "release/v$VERSION"
          # No review requested/approved here: branch protection on main
          # doesn't require one (only the "build-and-test" status check), and
          # this token can't approve its own PR anyway.
          gh pr merge --auto --squash "release/v$VERSION"
